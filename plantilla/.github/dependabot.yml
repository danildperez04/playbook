# Dependabot abre PR para mantener al día dependencias y acciones.
# Los PR llegan agrupados para no inundar la bandeja; las actualizaciones de
# seguridad llegan aparte y en cuanto se publican.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: America/Managua
    target-branch: develop
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    labels: ['tipo:deuda', 'área:infra']
    groups:
      tooling:
        patterns:
          [
            'eslint*',
            '@eslint/*',
            'typescript*',
            'prettier',
            'vitest',
            '@vitest/*',
            '@commitlint/*',
            'husky',
            'lint-staged',
            '@types/*',
          ]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Managua
    target-branch: develop
    commit-message:
      prefix: ci
      include: scope
    labels: ['tipo:deuda', 'área:infra']
    groups:
      actions:
        patterns: ['*']
