name: CI

on:
  pull_request:
    # `edited`: corregir el título del PR vuelve a validarlo; sin esto el check de
    # Calidad seguía en rojo con el título viejo y re-ejecutarlo usaba el mismo dato.
    # Corre todo el CI, no solo Calidad: un job omitido contaría como aprobado.
    types: [opened, synchronize, reopened, edited]
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Mínimo privilegio: los jobs solo leen el repositorio.
permissions:
  contents: read

env:
  NODE_VERSION: '24'

# Las acciones van fijadas a un SHA (con su versión en el comentario): una etiqueta
# como v5 puede moverse. Dependabot las mantiene al día (.github/dependabot.yml).
jobs:
  quality:
    name: Calidad (formato · commits · título del PR)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Formato (Prettier)
        run: pnpm format:check
      - name: Título del PR (será el commit tras el squash)
        if: github.event_name == 'pull_request'
        env:
          # Por variable de entorno, nunca interpolado en el script: el título lo escribe quien abre el PR.
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | pnpm exec commitlint --verbose
      - name: Commits del PR
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE" --to "$HEAD" --verbose

  checks:
    name: Lint · typecheck · pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
